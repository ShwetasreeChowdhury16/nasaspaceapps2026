<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;font-family:"Source Sans Pro",system-ui,sans-serif}
#wrap{display:flex;justify-content:center}
canvas{cursor:grab;touch-action:none;display:block;outline:none}
canvas.dragging{cursor:grabbing}
#tip{position:fixed;pointer-events:none;background:#0e1a30;color:#eef3f9;border:1px solid #22355a;border-radius:8px;padding:4px 8px;font-size:12px;display:none;white-space:nowrap}
</style></head>
<body><div id="wrap"><canvas id="globe" tabindex="0" aria-label="Globe. Drag to rotate, click a point to investigate it, arrow keys rotate."></canvas></div><div id="tip"></div>
<script src="d3.min.js"></script><script src="topojson-client.min.js"></script>
<script>
// ---- Streamlit component protocol (no build step needed) ----
const send=(type,data)=>window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},data),"*");
const setValue=v=>send("streamlit:setComponentValue",{value:v,dataType:"json"});

const cv=document.getElementById("globe"),ctx=cv.getContext("2d"),tip=document.getElementById("tip");
const proj=d3.geoOrthographic().clipAngle(90),gpath=d3.geoPath(proj,ctx),grat=d3.geoGraticule10();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let rot=[87.6,-30],size=0,spin=!reduce,fly=null,down=null,last=0,idleTimer=null;
let places=[],sel=null,accent="#62b4ee",height=500,selKey=null;
let landLo=null,landHi=null,borders=null,hi=false;

const C={ocean:"#1a4873",land:"#5fa57c",grat:"rgba(255,255,255,0.14)",border:"rgba(255,255,255,0.40)",coast:"#2c5a40",rim:"#3a5f8f",card:"#0e1a30",text:"#eef3f9",line:"#22355a"};
const visible=(lon,lat)=>d3.geoDistance([lon,lat],[-rot[0],-rot[1]])<Math.PI/2-0.03;

function resize(){const w=Math.min(height,Math.max(240,document.body.clientWidth||height)),d=window.devicePixelRatio||1;
 cv.style.width=cv.style.height=w+"px";cv.width=cv.height=Math.round(w*d);ctx.setTransform(d,0,0,d,0,0);size=w;
 proj.translate([w/2,w/2]).scale(w/2-6);send("streamlit:setFrameHeight",{height:w+4});draw()}

// Coarse land while moving keeps rotation smooth; detailed coastlines and borders once it settles.
function moving(){hi=false;clearTimeout(idleTimer);idleTimer=setTimeout(()=>{hi=true;draw()},180)}

function draw(){if(!size)return;const w=size;ctx.clearRect(0,0,w,w);proj.rotate(rot);
 ctx.beginPath();gpath({type:"Sphere"});ctx.fillStyle=C.ocean;ctx.fill();
 ctx.beginPath();gpath(grat);ctx.strokeStyle=C.grat;ctx.lineWidth=0.6;ctx.stroke();
 const land=(hi&&landHi)?landHi:landLo;
 if(land){ctx.beginPath();gpath(land);ctx.fillStyle=C.land;ctx.fill();ctx.strokeStyle=C.coast;ctx.lineWidth=0.7;ctx.stroke()}
 if(hi&&borders){ctx.beginPath();gpath(borders);ctx.strokeStyle=C.border;ctx.lineWidth=0.5;ctx.stroke()}
 ctx.beginPath();gpath({type:"Sphere"});ctx.strokeStyle=C.rim;ctx.lineWidth=1.5;ctx.stroke();
 for(const p of places){if(!visible(p.lon,p.lat))continue;const [x,y]=proj([p.lon,p.lat]);
  ctx.beginPath();ctx.arc(x,y,4.5,0,7);ctx.fillStyle="#ffffff";ctx.fill();ctx.lineWidth=2;ctx.strokeStyle="#0d1b2a";ctx.stroke()}
 if(sel&&visible(sel.lon,sel.lat)){const [x,y]=proj([sel.lon,sel.lat]);
  ctx.beginPath();ctx.arc(x,y,6.5,0,7);ctx.fillStyle=accent;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=C.card;ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.stroke();
  const t=sel.label||"";if(t){ctx.font="600 13px 'Source Sans Pro',system-ui,sans-serif";const tw=ctx.measureText(t).width+16;let bx=x+18;if(bx+tw>w-4)bx=x-18-tw;const by=y-12;
   ctx.beginPath();ctx.roundRect(bx,by,tw,24,12);ctx.fillStyle=C.card;ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.stroke();
   ctx.fillStyle=C.text;ctx.textBaseline="middle";ctx.fillText(t,bx+8,by+12.5)}}}

function flyTo(lon,lat){const to=[-lon,-Math.max(-55,Math.min(55,lat))];const d=((to[0]-rot[0])%360+540)%360-180;to[0]=rot[0]+d;
 if(reduce){rot=to;hi=true;draw();return}fly={from:rot.slice(),to,t0:performance.now()}}

d3.timer(()=>{if(fly){const t=Math.min(1,(performance.now()-fly.t0)/900),e=d3.easeCubicInOut(t);
  rot=[fly.from[0]+(fly.to[0]-fly.from[0])*e,fly.from[1]+(fly.to[1]-fly.from[1])*e];moving();if(t>=1)fly=null;draw()}
 else if(spin&&!down){rot[0]+=0.12;moving();draw()}});

function placeAt(x,y){for(const p of places){if(!visible(p.lon,p.lat))continue;const q=proj([p.lon,p.lat]);if(Math.hypot(q[0]-x,q[1]-y)<12)return p}return null}
function local(e){const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]}

cv.addEventListener("pointerdown",e=>{spin=false;fly=null;down={x:e.clientX,y:e.clientY,r:rot.slice(),moved:false};cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{
 if(!down){const [x,y]=local(e);const p=placeAt(x,y);let txt=null;
  if(p)txt=p.name+" · click to investigate";else if(Math.hypot(x-size/2,y-size/2)<proj.scale()){const ll=proj.invert([x,y]);if(ll)txt=ll[1].toFixed(1)+"°, "+ll[0].toFixed(1)+"° · click to investigate"}
  if(txt){tip.textContent=txt;tip.style.display="block";tip.style.left=Math.min(e.clientX+12,size-tip.offsetWidth-2)+"px";tip.style.top=(e.clientY+14)+"px"}else tip.style.display="none";return}
 const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.abs(dx)+Math.abs(dy)>4){down.moved=true;cv.classList.add("dragging");tip.style.display="none"}
 if(down.moved){const k=75/proj.scale();rot=[down.r[0]+dx*k,Math.max(-80,Math.min(80,down.r[1]-dy*k))];moving();draw()}});
cv.addEventListener("pointerup",e=>{const d=down;down=null;cv.classList.remove("dragging");if(!d||d.moved)return;  // a drag never selects
 const [x,y]=local(e);const p=placeAt(x,y);
 if(p){setValue({place:p.name,lat:p.lat,lon:p.lon,n:Date.now()});return}
 if(Math.hypot(x-size/2,y-size/2)>proj.scale())return;const ll=proj.invert([x,y]);if(!ll||isNaN(ll[0])||isNaN(ll[1]))return;
 setValue({place:null,lat:+Math.max(-85,Math.min(85,ll[1])).toFixed(2),lon:+ll[0].toFixed(2),n:Date.now()})});
cv.addEventListener("pointercancel",()=>{down=null;cv.classList.remove("dragging")});
cv.addEventListener("pointerleave",()=>tip.style.display="none");
cv.addEventListener("keydown",e=>{const m={ArrowLeft:[8,0],ArrowRight:[-8,0],ArrowUp:[0,-8],ArrowDown:[0,8]}[e.key];
 if(m){e.preventDefault();spin=false;rot=[rot[0]+m[0],Math.max(-80,Math.min(80,rot[1]+m[1]))];moving();draw()}});
window.addEventListener("resize",resize);

// Each Streamlit rerun sends new args; the iframe (and the user's rotation) survives between reruns.
window.addEventListener("message",ev=>{const d=ev.data;if(!d||d.type!=="streamlit:render")return;const a=d.args||{};
 places=a.places||[];accent=a.accent||accent;const newH=a.height||500;
 const s=a.selected||null,k=s?(s.lat.toFixed(3)+","+s.lon.toFixed(3)):null;sel=s;
 if(newH!==height||!size){height=newH;resize()}
 if(k!==selKey){const first=selKey===null;selKey=k;if(s){if(first){rot=[-s.lon,-Math.max(-55,Math.min(55,s.lat))];hi=true}else{spin=false;flyTo(s.lon,s.lat)}}}
 draw()});

Promise.all([fetch("land-110m.json").then(r=>r.json()),fetch("countries-50m.json").then(r=>r.json())]).then(([lo,c])=>{
 landLo=topojson.feature(lo,lo.objects.land);landHi=topojson.merge(c,c.objects.countries.geometries);
 borders=topojson.mesh(c,c.objects.countries,(a,b)=>a!==b);hi=true;draw()});
send("streamlit:componentReady",{apiVersion:1});
</script></body></html>
